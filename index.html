<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus PC Watch — Smart Campus Network Monitor</title>

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- SEO & Metadata -->
    <meta name="description" content="Campus PC Watch — Real-time network monitoring system for college computer labs. Track device status, manage alerts, and monitor lab health from one dashboard." />
    <meta name="keywords" content="campus pc watch, network monitoring, computer lab management, device telemetry, lab health, real-time alert system" />
    <meta name="author" content="Campus PC Watch Team" />
    <meta name="application-name" content="Campus PC Watch" />
    <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS Web App Configuration -->
    <meta name="apple-mobile-web-app-title" content="Campus PC Watch" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Campus PC Watch — Smart Campus Network Monitor" />
    <meta property="og:description" content="Real-time network monitoring system for college computer labs. Track device status, manage alerts, and monitor lab health from one dashboard." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="Campus PC Watch" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Campus PC Watch — Smart Campus Network Monitor" />
    <meta name="twitter:description" content="Real-time network monitoring system for college computer labs. Track device status, manage alerts, and monitor lab health from one dashboard." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Typography (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Fallback for users with JavaScript disabled -->
    <noscript>
      <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; background-color: #0a0d14; color: #edf0f7;">
        <h1 style="font-size: 1.5rem; margin-bottom: 8px;">JavaScript is Required</h1>
        <p style="color: #8a9bb8; max-width: 440px; line-height: 1.5;">Campus PC Watch requires JavaScript to display real-time lab metrics and system status. Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </noscript>

    <!-- React Root with Pre-mount Loading Placeholder -->
    <div id="root">
      <div id="pre-mount-spinner" style="position: fixed; inset: 0; background-color: #0a0d14; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #edf0f7; overflow: hidden;">
        <style>
          @keyframes node-pulse {
            0%, 100% { r: 3; opacity: 1; filter: drop-shadow(0 0 4px #4f8ef7); }
            50% { r: 5; opacity: 0.5; filter: drop-shadow(0 0 10px #4f8ef7); }
          }
          @keyframes node-pulse-delay1 {
            0%, 100% { r: 3; opacity: 0.6; filter: drop-shadow(0 0 3px #6dd5fa); }
            50% { r: 4.5; opacity: 1; filter: drop-shadow(0 0 8px #6dd5fa); }
          }
          @keyframes node-pulse-delay2 {
            0%, 100% { r: 3; opacity: 0.8; filter: drop-shadow(0 0 3px #a78bfa); }
            50% { r: 5; opacity: 0.4; filter: drop-shadow(0 0 10px #a78bfa); }
          }
          @keyframes link-flow {
            0% { stroke-dashoffset: 30; opacity: 0.2; }
            50% { opacity: 0.9; }
            100% { stroke-dashoffset: 0; opacity: 0.2; }
          }
          @keyframes link-flow2 {
            0% { stroke-dashoffset: 0; opacity: 0.15; }
            50% { opacity: 0.75; }
            100% { stroke-dashoffset: 30; opacity: 0.15; }
          }
          @keyframes grid-rotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
          }
          @keyframes scan-line {
            0%   { transform: translateY(-50px); opacity: 0; }
            20%  { opacity: 0.6; }
            80%  { opacity: 0.6; }
            100% { transform: translateY(50px); opacity: 0; }
          }
          @keyframes text-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
          }
          @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
          }
          .net-node-a { animation: node-pulse 2s ease-in-out infinite; }
          .net-node-b { animation: node-pulse-delay1 2s ease-in-out 0.4s infinite; }
          .net-node-c { animation: node-pulse-delay2 2s ease-in-out 0.8s infinite; }
          .net-node-d { animation: node-pulse-delay1 2s ease-in-out 1.2s infinite; }
          .net-node-e { animation: node-pulse 2s ease-in-out 1.6s infinite; }
          .net-link-a { stroke-dasharray: 6 4; animation: link-flow 1.8s linear infinite; }
          .net-link-b { stroke-dasharray: 6 4; animation: link-flow2 1.8s linear 0.5s infinite; }
          .net-link-c { stroke-dasharray: 6 4; animation: link-flow 2.2s linear 0.9s infinite; }
          .net-link-d { stroke-dasharray: 6 4; animation: link-flow2 2s linear 0.3s infinite; }
          .net-link-e { stroke-dasharray: 6 4; animation: link-flow 1.6s linear 1.1s infinite; }
          .scan { animation: scan-line 2.4s ease-in-out infinite; }
          .spinner-wrap { animation: fade-in-up 0.6s ease-out both; }
          .loading-dot { animation: text-blink 1.2s ease-in-out infinite; }
        </style>

        <!-- Background hex grid dots (decorative) -->
        <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:0.07;pointer-events:none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="hex-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
              <circle cx="20" cy="20" r="1.2" fill="#4f8ef7"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#hex-dots)"/>
        </svg>

        <div class="spinner-wrap" style="display:flex;flex-direction:column;align-items:center;gap:0;">
          <!-- Network SVG -->
          <div style="position:relative;width:130px;height:120px;">
            <!-- Scan line -->
            <div class="scan" style="position:absolute;left:10px;right:10px;height:1px;background:linear-gradient(90deg,transparent,#4f8ef7,transparent);top:50%;z-index:2;"></div>

            <svg width="130" height="120" viewBox="0 0 130 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;">
              <!-- Links -->
              <line class="net-link-a" x1="65" y1="20" x2="20" y2="60" stroke="#4f8ef7" stroke-width="1.2"/>
              <line class="net-link-b" x1="65" y1="20" x2="110" y2="60" stroke="#6dd5fa" stroke-width="1.2"/>
              <line class="net-link-c" x1="20" y1="60" x2="65" y2="100" stroke="#4f8ef7" stroke-width="1.2"/>
              <line class="net-link-d" x1="110" y1="60" x2="65" y2="100" stroke="#a78bfa" stroke-width="1.2"/>
              <line class="net-link-e" x1="20" y1="60" x2="110" y2="60" stroke="#6dd5fa" stroke-width="1"/>
              <!-- Extra diagonal -->
              <line class="net-link-a" x1="65" y1="20" x2="65" y2="100" stroke="#4f8ef7" stroke-width="0.8" opacity="0.4"/>
              <!-- Nodes -->
              <circle class="net-node-a" cx="65" cy="20" r="3" fill="#4f8ef7"/>
              <circle class="net-node-b" cx="20" cy="60" r="3" fill="#6dd5fa"/>
              <circle class="net-node-c" cx="110" cy="60" r="3" fill="#a78bfa"/>
              <circle class="net-node-d" cx="65" cy="100" r="3" fill="#4f8ef7"/>
              <circle class="net-node-e" cx="65" cy="60" r="4" fill="#4f8ef7"/>
              <!-- Center hub ring -->
              <circle cx="65" cy="60" r="9" stroke="#4f8ef7" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" style="animation:grid-rotate 4s linear infinite;transform-origin:65px 60px;"/>
            </svg>
          </div>

          <!-- Label -->
          <div style="margin-top:18px;font-weight:700;font-size:16px;letter-spacing:0.06em;color:#edf0f7;text-transform:uppercase;text-shadow:0 0 12px rgba(79,142,247,0.6);">Campus PC Watch</div>
          <div style="margin-top:6px;font-size:11px;color:#4f8ef7;letter-spacing:0.12em;text-transform:uppercase;">Initializing network<span class="loading-dot">...</span></div>

          <!-- Progress bar -->
          <div style="margin-top:16px;width:120px;height:2px;background:rgba(79,142,247,0.15);border-radius:2px;overflow:hidden;">
            <div style="height:100%;width:40%;background:linear-gradient(90deg,#4f8ef7,#a78bfa);border-radius:2px;animation:link-flow 1.4s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Application Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
